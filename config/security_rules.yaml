rules:
  - id: GJS001
    languages: [javascript, typescript]
    message: Dynamic expression evaluation requires a security review.
    severity: WARNING
    pattern: eval(...)
  - id: GJS002
    languages: [javascript, typescript]
    message: Dynamic function construction requires a security review.
    severity: WARNING
    pattern-either:
      - pattern: new Function(...)
      - pattern: Function(...)
  - id: GJS003
    languages: [javascript, typescript]
    message: Shell command execution requires a security review.
    severity: WARNING
    # Match Node bindings, including aliases; unrelated and shadowed names do not qualify.
    # exec uses a shell; argument APIs need a literal true or nonempty string shell option.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "require('child_process').$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      const $CP = require('child_process');
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      let $CP = require('child_process');
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      var $CP = require('child_process');
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      import * as $CP from 'child_process';
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      import $CP from 'child_process';
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD as $CALL, ... } from 'child_process';
                      ...
                  - pattern: "$CALL(...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD, ... } from 'child_process';
                      ...
                  - pattern: "$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD: $CALL, ... } = require('child_process');
                      ...
                  - pattern: "$CALL(...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD, ... } = require('child_process');
                      ...
                  - pattern: "$METHOD(...)"
              - pattern: "require('node:child_process').$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      const $CP = require('node:child_process');
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      let $CP = require('node:child_process');
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      var $CP = require('node:child_process');
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      import * as $CP from 'node:child_process';
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      import $CP from 'node:child_process';
                      ...
                  - pattern: "$CP.$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD as $CALL, ... } from 'node:child_process';
                      ...
                  - pattern: "$CALL(...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD, ... } from 'node:child_process';
                      ...
                  - pattern: "$METHOD(...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD: $CALL, ... } = require('node:child_process');
                      ...
                  - pattern: "$CALL(...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD, ... } = require('node:child_process');
                      ...
                  - pattern: "$METHOD(...)"
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(exec|execSync)$'
      - patterns:
          - pattern-either:
              - pattern: "require('child_process').$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      const $CP = require('child_process');
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      let $CP = require('child_process');
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      var $CP = require('child_process');
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import * as $CP from 'child_process';
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import $CP from 'child_process';
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD as $CALL, ... } from 'child_process';
                      ...
                  - pattern: "$CALL(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD, ... } from 'child_process';
                      ...
                  - pattern: "$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD: $CALL, ... } = require('child_process');
                      ...
                  - pattern: "$CALL(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD, ... } = require('child_process');
                      ...
                  - pattern: "$METHOD(..., {shell: $SHELL, ...}, ...)"
              - pattern: "require('node:child_process').$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      const $CP = require('node:child_process');
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      let $CP = require('node:child_process');
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      var $CP = require('node:child_process');
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import * as $CP from 'node:child_process';
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import $CP from 'node:child_process';
                      ...
                  - pattern: "$CP.$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD as $CALL, ... } from 'node:child_process';
                      ...
                  - pattern: "$CALL(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      import { $METHOD, ... } from 'node:child_process';
                      ...
                  - pattern: "$METHOD(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD: $CALL, ... } = require('node:child_process');
                      ...
                  - pattern: "$CALL(..., {shell: $SHELL, ...}, ...)"
              - patterns:
                  - pattern-inside: |
                      const { $METHOD, ... } = require('node:child_process');
                      ...
                  - pattern: "$METHOD(..., {shell: $SHELL, ...}, ...)"
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(execFile|execFileSync|spawn|spawnSync)$'
          - metavariable-regex:
              metavariable: $SHELL
              regex: '^(true|"[^"]+"|\x27[^\x27]+\x27)$'
  - id: GJS004
    languages: [javascript, typescript]
    message: TLS certificate verification is disabled.
    severity: ERROR
    pattern: '{rejectUnauthorized: false, ...}'
  # Force parsing even when a file contains none of the security-rule keywords.
  # The constant-false condition prevents findings or source disclosure.
  - id: GJS000
    languages: [javascript, typescript]
    message: Internal parse coverage guard.
    severity: INFO
    patterns:
      - pattern: $EXPR
      - metavariable-comparison:
          comparison: '1 == 0'
