name: Release checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Install Linux confinement
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Install pinned dependency manager
        run: python -m pip install 'uv==0.12.23'
      - name: Sync the locked test environment
        run: uv sync --locked --extra dev --python 3.12
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Check Homebrew formula syntax
        if: runner.os == 'macOS'
        run: ruby -c Formula/ghost.rb
      - name: Check sandbox and Node prerequisites
        run: |
          node --version
          python -c 'import shutil, sys; assert shutil.which("sandbox-exec" if sys.platform == "darwin" else "bwrap")'
      - name: Run all tests with OS confinement enabled
        run: uv run --locked --extra dev --python 3.12 python -m pytest -q --junitxml=test-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and clean-install smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate version and tag
        id: version
        env:
          GHOST_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args=(--tag "$GHOST_RELEASE_TAG")
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          python scripts/release.py validate "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Install build tools and Linux confinement
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          python -m pip install 'build==1.3.0'
      - name: Build source archive and wheel from that archive
        run: python -m build
      - name: Validate distributions and prepare release assets
        run: python scripts/release.py prepare --dist dist
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/ghost-release-smoke"
          "$RUNNER_TEMP/ghost-release-smoke/bin/python" -m pip install dist/*.whl
      - name: Run installed CLI and real security repair demo outside checkout
        env:
          GHOST_NO_ANIMATION: '1'
          NO_COLOR: '1'
        run: |
          "$RUNNER_TEMP/ghost-release-smoke/bin/python" -I scripts/probe_release_scanner.py
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ghost-release-smoke/bin/python" -I -c 'import surfaces; assert "ghost-release-smoke" in surfaces.__file__, surfaces.__file__'
          "$RUNNER_TEMP/ghost-release-smoke/bin/ghost" --help
          "$RUNNER_TEMP/ghost-release-smoke/bin/ghost" demo --security
      - name: Retain validated distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-dist
          path: dist
      - name: Verify downloaded checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create reviewable draft from an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GHOST_RELEASE_TAG: ${{ needs.build.outputs.tag }}
          GHOST_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [[ "$GHOST_PRERELEASE" == true ]]; then args=(--prerelease); fi
          gh release create "$GHOST_RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --title "Ghost $GHOST_RELEASE_TAG" \
            --notes-file dist/release-notes.md "${args[@]}"
