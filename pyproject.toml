[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ghost-debugger"
version = "0.1.0"
description = "Local-first security review with evidence-gated repairs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "prompt-toolkit>=3.0.48,<4", "pydantic>=2", "watchdog>=4", "httpx>=0.27", "bandit>=1.8,<2", "semgrep>=1.179,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.100"]

[project.scripts]
ghost = "surfaces.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bootstrap", "config", "core", "infrastructure", "surfaces"]
