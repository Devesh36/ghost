[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-debugger"
version = "0.1.0"
description = "An evidence-driven, local-first debugging CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2", "watchdog>=4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ghost = "ghost.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ghost"]
